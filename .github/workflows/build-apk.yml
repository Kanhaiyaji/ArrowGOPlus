name: Build & Release Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Accept Android Licenses & Ensure SDK Tools
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Install Node Dependencies
        run: npm ci

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Web Application
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
        run: npm run build

      - name: Sync Web Assets to Android Project
        run: |
          npx cap copy android || true
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/
          echo "=== Android Assets Directory Verification ==="
          ls -la android/app/src/main/assets/public/
          test -f android/app/src/main/assets/public/index.html || { echo "::error::Missing index.html in android assets!"; exit 1; }

      - name: Build Debug APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace
          cd ..
          cp android/app/build/outputs/apk/debug/app-debug.apk ArrowGOPlus.apk

      - name: Verify APK Integrity (Must Bundle Web Assets)
        run: |
          node -e "
          const fs = require('fs');
          const buf = fs.readFileSync('ArrowGOPlus.apk');
          if (buf.indexOf(Buffer.from('assets/public/index.html')) === -1) {
            console.error('::error::CRITICAL: ArrowGOPlus.apk was built without assets/public/index.html!');
            process.exit(1);
          }
          console.log('✓ VERIFICATION SUCCESSFUL: ArrowGOPlus.apk contains index.html and all assets.');
          "

      - name: Upload APK to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ArrowGOPlus-APK
          path: ArrowGOPlus.apk
          retention-days: 30

      - name: Extract Project Version
        id: get_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=v$VERSION" >> $GITHUB_OUTPUT

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.get_version.outputs.version }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('Arrow GO+ {0} (Latest APK)', steps.get_version.outputs.version) }}
          body: |
            ## 🏹 Arrow GO+ Android Mobile App (${{ steps.get_version.outputs.version }})

            Official Android APK release built automatically by GitHub Actions CI/CD.

            ### 📲 Direct APK Download (Single Tap Install):
            - ⬇️ **[ArrowGOPlus.apk](https://github.com/${{ github.repository }}/releases/download/${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.get_version.outputs.version }}/ArrowGOPlus.apk)**

            ### 🎮 Features & Updates in ${{ steps.get_version.outputs.version }}:
            - 👑 **5 Luxury Theme Suites**:
              - 🖤 **Obsidian Dark** (Ultra sleek stealth dark + electric cyan)
              - 🤍 **Titanium White** (High-contrast clean daylight luxury with deep slate arrows)
              - 👑 **Royal Gold** (24K Gold luxury accents with midnight onyx backdrop)
              - 💚 **Emerald Jade** (Deep rainforest tones with radiant mint neon)
              - 💜 **Velvet Amethyst** (Midnight royal violet with neon coral highlights)
            - 🔄 **Real-Time Theme Switching**: Choose themes directly in Settings (⚙️) with instant board and canvas updates.
            - 📱 **Full Mobile Responsiveness**: Dynamic fit on all screen sizes and aspect ratios.
            - 🏹 **Branded Launcher Icon**: Futuristic neon cyan 3D arrow with golden '+' badge.
            - ⚡ **108 Handcrafted Levels**: Beginner, Intermediate & Trained Tiers.
            - 🌐 **Offline WebView**: 100% standalone gameplay without network dependency.
            - ☁️ **Cloud Sync & Google Login**: Preserves progress and stats seamlessly.
          files: ArrowGOPlus.apk
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

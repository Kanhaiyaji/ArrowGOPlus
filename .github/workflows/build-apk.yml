name: Build & Release Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Accept Android Licenses & Ensure SDK Tools
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Web Application
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
        run: npm run build

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cd ..
          cp android/app/build/outputs/apk/debug/app-debug.apk ArrowGOPlus.apk

      - name: Upload APK to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ArrowGOPlus-APK
          path: ArrowGOPlus.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Arrow GO+ v1.0.0 (Latest APK)' }}
          body: |
            ## 🏹 Arrow GO+ Android Mobile App

            Official Android APK release built automatically by GitHub Actions CI/CD.

            ### 📲 Direct APK Download (Single Tap Install):
            - ⬇️ **[ArrowGOPlus.apk](https://github.com/${{ github.repository }}/releases/download/${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}/ArrowGOPlus.apk)**

            ### 🎮 Features:
            - **108 Handcrafted Levels** across 3 Tiers (Beginner, Intermediate, Trained)
            - **Google OAuth Login** via Supabase
            - **Cloud Save & Sync** across sessions
            - **Web Audio & Haptic Feedback**
            - **Offline Puzzle Engine & Level Editor**
          files: ArrowGOPlus.apk
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
